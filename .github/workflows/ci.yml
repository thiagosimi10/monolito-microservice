# CI - every PR to main and every push to main. No deploy, no cloud credentials.
#
#   backend  (FastAPI):  Lint -> Type Check -> Unit Tests -> Integration Tests
#   frontend (Vue/Vite): Frontend Tests -> Frontend Build
#   images:              Build (docker build both images + container scan)
#
# Integration Tests use a REAL PostgreSQL 16 service container and the
# isolated database monolith_test (the test suite refuses any database whose
# name does not contain "test"). The schema comes from the real migrations.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  OTEL_SDK_DISABLED: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

      - name: hadolint (backend + frontend)
        working-directory: .
        run: |
          for f in backend/Dockerfile frontend/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold warning - < "$f"
          done

      - name: shellcheck
        working-directory: .
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --severity=warning backend/entrypoint.sh

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: mypy

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest -m unit
        run: >
          pytest -m unit --maxfail=10 -o addopts=""
          --cov --cov-report=term --cov-report=xml:coverage-unit.xml
          --junitxml=junit-unit.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "Unit coverage: $(coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-reports
          path: |
            backend/junit-unit.xml
            backend/coverage-unit.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monolith_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/monolith_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Migrations (alembic upgrade head on monolith_test)
        run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      - name: pytest -m integration (real PostgreSQL)
        run: >
          pytest -m integration -o addopts=""
          --cov --cov-report=term --cov-report=xml:coverage-integration.xml
          --junitxml=junit-integration.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "Integration coverage: $(coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-reports
          path: |
            backend/junit-integration.xml
            backend/coverage-integration.xml
          retention-days: 7

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: docker build (backend, frontend)
        run: |
          docker build -t monolith-backend:ci backend
          docker build -t monolith-frontend:ci frontend

      - name: Images run as non-root
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' monolith-backend:ci)" = "1000"
          test "$(docker image inspect -f '{{.Config.User}}' monolith-frontend:ci)" = "node"

      - name: Container scan (Trivy, HIGH/CRITICAL with a fix available)
        run: |
          for img in monolith-backend:ci monolith-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 \
              image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$img"
          done

      - name: docker compose config
        run: docker compose config --quiet